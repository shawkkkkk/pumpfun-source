name: Capture frozen FAF CTO diagnostic IR
run-name: Frozen faf99624 one diagnostic IR capture on macos-26
on:
  workflow_dispatch:
env:
  PYTHONDONTWRITEBYTECODE: "1"
permissions:
  contents: read
  actions: read
concurrency:
  group: pump-faf99624-diagnostic-ir
  cancel-in-progress: false
jobs:
  control:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/qualify-pump-macos-v144.yml
            /reconstruction/pump-main/lanes/current-native-ir-capture/pump_ir_control.py
            /reconstruction/pump-main/lanes/current-native-ir-capture/README.md
            /reconstruction/pump-main/lanes/current-native-ir-capture/capture.py
            /programs/pump/
            /reconstruction/harness/
            /reconstruction/toolchain/
            /reconstruction/base/
            /reconstruction/pump-main/baseline/
            /evidence/original/pump/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate the frozen source checkpoint metadata
        run: git -c gc.auto=0 -c maintenance.auto=false fetch --depth=1 --filter=blob:none --no-tags origin faf99624250b4e60107790f7edabf6609f709885
      - name: Retrieve exact admitted frozen FAF control reference
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: shawkkkkk/pumpfun-source
          run-id: 41146593117
          artifact-ids: '13020993188'
          merge-multiple: true
          path: work/faf-reference
      - name: One diagnostic cold build with full input guards
        run: python3 -B reconstruction/pump-main/lanes/current-native-ir-capture/pump_ir_control.py
      - name: Retain actual source, provenance, compiler output and census
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-faf99624-diagnostic-ir-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/pump-faf-ir/evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
