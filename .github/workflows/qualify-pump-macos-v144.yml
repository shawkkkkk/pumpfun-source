name: Measure one frozen Pump native pair
run-name: One cold control and candidate on macos-26
on:
  workflow_dispatch:
    inputs:
      source_base:
        description: Exact reviewed source-base commit (40 lowercase hex)
        required: true
        type: string
      candidate:
        description: Exact reviewed one-Rust-delta child commit
        required: true
        type: string
      changed_source_path:
        description: The single reviewed Rust source path
        required: true
        type: choice
        options:
          - programs/pump/src/buy_v2.rs
          - programs/pump/src/creator/admin_cto.rs
          - programs/pump/src/multi_hop_curve_swap.rs
permissions:
  contents: read
concurrency:
  group: pump-native-one-pair-measurement
  cancel-in-progress: false
jobs:
  pair:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SOURCE_BASE: ${{ inputs.source_base }}
      CANDIDATE_COMMIT: ${{ inputs.candidate }}
      CHANGED_SOURCE_PATH: ${{ inputs.changed_source_path }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/qualify-pump-macos-v144.yml
            /reconstruction/pump-main/lanes/native-pair-measurement/
            /programs/pump/
            /reconstruction/harness/
            /reconstruction/toolchain/
            /reconstruction/base/
            /reconstruction/pump-main/baseline/
            /evidence/original/pump/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch only the two reviewed immutable commits
        shell: bash
        run: |
          [[ "$SOURCE_BASE" =~ ^[0-9a-f]{40}$ && "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git -c gc.auto=0 -c maintenance.auto=false fetch --depth=1 --filter=blob:none --no-tags origin "$SOURCE_BASE" "$CANDIDATE_COMMIT"
      - name: One control and one candidate, both cold
        run: |
          python3 -B reconstruction/pump-main/lanes/native-pair-measurement/measure_pair.py --source-base "$SOURCE_BASE" --candidate "$CANDIDATE_COMMIT" --changed-source-path "$CHANGED_SOURCE_PATH"
      - name: Retain both actual images, inputs and full comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-native-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/pump-native-pair/evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
