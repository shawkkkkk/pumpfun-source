name: Measure exact S2 creator-fee boundary identity candidate
run-name: Frozen 5cfe37b1 creator-fee boundary candidate on macos-26
on:
  workflow_dispatch:
env:
  PYTHONDONTWRITEBYTECODE: "1"
permissions:
  contents: read
  actions: read
concurrency:
  group: pump-5cfe37b1-candidate-identity
  cancel-in-progress: false
jobs:
  control:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/qualify-pump-macos-v144.yml
            /reconstruction/pump-main/lanes/current-native-control/pump_current_control.py
            /reconstruction/pump-main/lanes/current-native-control/README.md
            /programs/pump/
            /reconstruction/harness/
            /reconstruction/toolchain/
            /reconstruction/base/
            /reconstruction/pump-main/baseline/
            /evidence/original/pump/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate the frozen source checkpoint metadata
        run: git -c gc.auto=0 -c maintenance.auto=false fetch --depth=1 --filter=blob:none --no-tags origin 5cfe37b14b5486b802782651fde4a39985141494
      - name: Authenticate the exact current control source metadata
        run: git -c gc.auto=0 -c maintenance.auto=false fetch --depth=1 --filter=blob:none --no-tags origin ecea7021fcb6a09959901522c6a4edca150a1a1b
      - name: Retrieve the exact admitted current control
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: shawkkkkk/pumpfun-source
          run-id: 41166161483
          artifact-ids: '13029328269'
          merge-multiple: true
          path: work/current-ecea-reference
      - name: One exact S2 source build with full SDK inventory checks
        run: python3 -B reconstruction/pump-main/lanes/current-native-control/pump_current_control.py
      - name: Retain actual source, provenance, compiler output and census
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-5cfe37b1-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/pump-candidate-identity/evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
