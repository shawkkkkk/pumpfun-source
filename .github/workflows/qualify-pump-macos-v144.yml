name: Qualify current Pump identity control
run-name: Current60bdd single cold identity control
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pump-current60bdd-identity-control
  cancel-in-progress: false
jobs:
  control:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/qualify-pump-macos-v144.yml
            /scripts/pump_current_control.py
            /programs/pump/
            /reconstruction/harness/
            /reconstruction/toolchain/
            /reconstruction/base/
            /reconstruction/pump-main/baseline/
            /evidence/original/pump/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Authenticate the frozen source checkpoint metadata
        run: git -c gc.auto=0 -c maintenance.auto=false fetch --depth=1 --filter=blob:none --no-tags origin 60bdd8a7a522921058d18563bb9335d2a06aec75
      - name: One unchanged source build with full SDK inventory checks
        run: python3 -B scripts/pump_current_control.py
      - name: Retain actual source, provenance, compiler output and census
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-current60bdd-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/pump-current-identity/evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
