name: Qualify archived673 Pump on pinned native macOS v1.44
run-name: Archived673 ${{ inputs.proposal || 'control' }} native v1.44
on:
  workflow_dispatch:
    inputs:
      proposal:
        description: Unchanged control or one independently frozen proposal
        type: choice
        default: control
        options: [control, cto, sweep, perhop, sell-event, constructor, cto-used-flow, perhop-clock, sweep-read-timing]
permissions:
  contents: read
  actions: read
concurrency:
  group: pump-current673-native-macos-v144-${{ inputs.proposal || 'control' }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'shawkkkkk/pumpfun-source'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/qualify-pump-macos-v144.yml
            /scripts/pump_current673_macos_control.py
            /scripts/pump_current673_macos_candidate.py
            /research/pump-final-composition-673-20261028/source/
            /evidence/original/pump/
            /research/pump-current673-macos-qualification/
            /research/pump-final-composition-cold-20261028/build.py
            /research/pump-final-composition-cold-20261028/build-inputs.json
            /research/pump-final-composition-cold-20261028/tools/
      - name: Authenticate archived673 source and portable builder
        run: python3 -B scripts/pump_current673_macos_control.py --source-directory research/pump-final-composition-673-20261028/source --inspect
      - name: Retrieve exact reproduced control for independent candidate measurement
        if: inputs.proposal != 'control'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: shawkkkkk/pumpfun-source
          run-id: 40791064153
          name: pump-current673-native-control-40791064153-1
          path: work/pump-current673-control-proof
      - name: Reproduce control or measure one frozen proposal from an empty target
        env:
          PROPOSAL: ${{ inputs.proposal }}
        run: |
          if [ "$PROPOSAL" = control ]; then
            python3 -B scripts/pump_current673_macos_control.py --source-directory research/pump-final-composition-673-20261028/source
          else
            python3 -B scripts/pump_current673_macos_candidate.py --source-directory research/pump-final-composition-673-20261028/source --candidate "$PROPOSAL"
          fi
      - name: Retain actual compiler inputs, outputs and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pump-current673-native-${{ inputs.proposal }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: work/pump-current673-macos-${{ inputs.proposal }}/evidence
          if-no-files-found: error
          retention-days: 30
